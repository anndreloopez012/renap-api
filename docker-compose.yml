services:
  strapi:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
      - strapi_uploads:/app/public/uploads
    command: sh -c "rm -rf dist && yarn install && yarn build && yarn start"

    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--dns-result-order=ipv4first"

      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: ${DATABASE_SSL}
      DATABASE_FILENAME: ${DATABASE_FILENAME}

      JWT_SECRET: ${JWT_SECRET}

    restart: always
    networks:
      - dokploy-network

    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # Router principal
      - traefik.http.routers.strapi.rule=Host(`${STRAPI_DOMAIN}`)
      - traefik.http.routers.strapi.entrypoints=websecure
      - traefik.http.routers.strapi.tls=true
      - traefik.http.routers.strapi.middlewares=strapi-upload

      # Sin límite de body y timeouts extendidos para uploads grandes (CSV)
      - traefik.http.middlewares.strapi-upload.buffering.maxRequestBodyBytes=0
      - traefik.http.middlewares.strapi-upload.buffering.memRequestBodyBytes=0

      # Timeouts del backend: 30 min para soportar uploads de varios GB
      - traefik.http.services.strapi.loadbalancer.server.port=1337
      - traefik.http.services.strapi.loadbalancer.responseForwarding.flushInterval=100ms

networks:
  dokploy-network:
    external: true

volumes:
  strapi_uploads:
    name: "${STRAPI}_strapi_uploads"
